name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: build-release-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S shader_system -B build

      - name: Build
        run: cmake --build build

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/shader-system-${GITHUB_REF_NAME}-linux-x64.tar.gz" \
            -C build ShaderExample libShaderSystemLib.a

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.ref_name }}
          path: dist/*

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-build-${{ github.ref_name }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Automated release for `${{ github.ref_name }}`.
            Versioning convention: `vMAJOR.MINOR.PATCH`.
