name: Automate Pull Requests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Close Stale Issues and Pull Requests
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been inactive for 30 days and has been marked as stale. It will be closed in 7 days unless there is new activity.'
          stale-pr-message: 'This pull request has been inactive for 30 days and has been marked as stale. It will be closed in 7 days unless there is new activity.'
          close-issue-message: 'This issue was closed automatically due to inactivity.'
          close-pr-message: 'This pull request was closed automatically due to inactivity.'
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,do-not-close'
          exempt-issue-labels: 'pinned,security,do-not-close'
          delete-branch: false
          operations-per-run: 100
