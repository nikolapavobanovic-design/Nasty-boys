name: Deepfake detector CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - "deepfake_detector/**"
      - "docs/**"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "deepfake_detector/**"
      - "docs/**"
      - ".github/workflows/**"

concurrency:
  group: deepfake-detector-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-detector:
    name: test-detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ./deepfake_detector[dev]

      - name: Run tests
        run: python -m pytest deepfake_detector/tests -q
